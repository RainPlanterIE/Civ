<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#183a36">
<meta name="description" content="Civ: build a historical civilisation with scarce resources, ongoing army and construction upkeep, mysterious advisor decisions and unexpected political consequences.">
<title>CIV — A Civilisation Begins</title>
<link rel="stylesheet" href="./style.css?v=17">
</head>
<body>
<canvas id="world" aria-label="Interactive isometric civilisation game world"></canvas>
<div id="overlay">
  <div id="top">
    <div id="gameIdentity"><div id="logo">CIV</div><div id="leaderName" aria-live="polite"></div><button id="courtBadge" class="court-badge" aria-label="Open royal court" title="Royal legitimacy and intrigue" hidden>👑 Court</button></div>
    <div id="stats" aria-live="polite"></div>
  </div>
  <div id="tools">
    <button id="zoomIn" class="smallbtn" aria-label="Zoom in">＋</button>
    <button id="zoomOut" class="smallbtn" aria-label="Zoom out">−</button>
    <button id="saveGame" class="smallbtn save-game" aria-label="Save game">💾 <span>Save</span></button>
    <button id="mapBtn" class="smallbtn" aria-label="Open world map" title="Earth overview">🌍</button>
    <button id="menu" class="smallbtn" aria-label="Game actions">☰</button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="worldOverview" class="panel" hidden>
    <div class="panelhead"><strong>🌍 World map</strong><button id="closeWorld" aria-label="Close world map">×</button></div>
    <canvas id="worldMini" width="720" height="360" aria-label="Click or tap to travel to a place on Earth"></canvas>
    <p>Tap anywhere to move your view. Explored cities are marked; undiscovered civilisations remain hidden.</p>
    <button id="homeView" class="secondary">⌖ Return to your civilisation</button>
  </div>
  <div id="footer">
    <div id="summary" class="panel" role="button" tabindex="0" aria-label="Technology research and progress"></div>
    <div id="actions"></div>
  </div>
  <section id="panel" class="panel" aria-label="Game controls"></section>
</div>
<div id="courtScene" class="court-scene-overlay" hidden aria-live="assertive"></div>
<div id="startScreen" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div class="main-menu">
    <div class="menu-eyebrow">A WORLD TO SHAPE</div>
    <h1 id="menuTitle">CIV</h1>
    <p class="menu-subtitle">Lead a civilisation — and keep your crown.</p>
    <div class="menu-rule"></div>
    <button id="playGame" class="menu-choice primary"><span>▶</span> Play <small>Begin as a random historical leader</small></button>
    <button id="continueGame" class="menu-choice secondary"><span>↪</span> Continue <small>Return to your saved world</small></button>
    <button id="backToGame" class="menu-back" hidden>← Back to game</button>
    <p id="menuStatus" class="menu-status" aria-live="polite">Checking for a saved game…</p>
    <p class="menu-note">Progress is saved in this browser. You can also save at any time during the game.</p>
  </div>
</div>
<script src="./world-atlas.js?v=17"></script>
<script src="./world-map.js?v=17"></script>
<script src="./game.js?v=17"></script>
</body>
</html>
