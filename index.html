<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#182b25"><title>CIV — A Civilisation Begins</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142a26;color:#f4ebd7;font-family:system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;touch-action:manipulation}#game{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none}#hud button,#hud .panel{pointer-events:auto}.top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:12px;gap:8px}.brand{font-family:Georgia,serif;color:#f4cf8d;font-size:28px;letter-spacing:5px;text-shadow:0 2px 8px #000}.res{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:78%}.chip{background:#182820d9;border:1px solid #a8a07766;border-radius:8px;padding:8px 9px;font-size:12px;box-shadow:0 3px 14px #0005;backdrop-filter:blur(7px)}.chip b{color:#f3d292}.bottom{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;right:12px;display:flex;align-items:end;justify-content:space-between;gap:12px}.panel{background:#172820eb;border:1px solid #c4ae785c;border-radius:12px;padding:13px;box-shadow:0 10px 35px #0009;backdrop-filter:blur(10px)}.intro{max-width:330px}.intro h2{font-family:Georgia,serif;font-size:21px;margin:0 0 6px;color:#f3d4a0}.intro p{font-size:12px;line-height:1.55;color:#d4dacd;margin:0 0 10px}.primary{background:#caa46c;color:#19241c;border:1px solid #e9cd94;border-radius:7px;padding:10px 15px;font-weight:800}.secondary{background:#334b3c;color:#f2ead5;border:1px solid #758d73;border-radius:7px;padding:9px 12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.toolbar{position:absolute;right:12px;top:80px;display:flex;flex-direction:column;gap:8px}.toolbar button{background:#1b3029e8;color:#f3e7cc;border:1px solid #a7a17c77;border-radius:8px;padding:11px;min-width:44px}.drawer{position:absolute;bottom:calc(100px + env(safe-area-inset-bottom,0px));right:12px;max-height:55dvh;overflow:auto;width:min(330px,calc(100vw - 24px));display:none}.drawer.open{display:block}.drawer h3{font-family:Georgia,serif;margin:0 0 10px;color:#f5d59c}.option{border:1px solid #617b65;background:#263e32;border-radius:8px;padding:10px;margin:7px 0}.option strong{display:block;font-size:13px}.option p{font-size:12px;color:#c1cebd;margin:4px 0 9px}.option button{width:100%}.hint{font-size:11px;color:#c6d0bd}.notice{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:#172b23e8;border:1px solid #a5a075;border-radius:9px;padding:9px 14px;max-width:75%;text-align:center;font-size:12px;opacity:0;transition:opacity .2s}.notice.show{opacity:1}.badge{color:#e5c58d;font-size:12px}.hide{display:none!important}@media(max-width:550px){.top{padding:9px}.brand{font-size:23px}.res{gap:4px}.chip{font-size:11px;padding:6px}.intro{max-width:min(270px,75vw)}.intro h2{font-size:18px}.bottom{bottom:calc(9px + env(safe-area-inset-bottom,0px))}.panel{padding:11px}.toolbar{top:76px;right:9px}.drawer{bottom:calc(116px + env(safe-area-inset-bottom,0px))}}
</style></head><body><canvas id="game"></canvas><div id="hud"><div class="top"><div class="brand">CIV</div><div class="res" id="resources"></div></div><div class="toolbar"><button id="zoomIn" aria-label="Zoom in">＋</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="menuBtn" aria-label="Open menu">☰</button></div><div class="notice" id="notice"></div><div class="bottom"><div class="panel intro" id="info"></div><div class="actions" id="actions"></div></div><div class="panel drawer" id="drawer"></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const SIZE=30,SEED=57,TW=88,TH=44;let cw=0,ch=0,dpr=1,zoom=1,cam={x:0,y:0},drag=null,selected=null,menu='',last=0,elapsed=0,noticeUntil=0;
const defs={house:{name:'House',icon:'🏠',wood:18,stone:5,years:3,desc:'Space for 4 additional citizens.'},farm:{name:'Farm',icon:'🌾',wood:12,stone:0,years:3,desc:'Produces 6 food per year.'},lumber:{name:'Lumber camp',icon:'🪵',wood:12,stone:4,years:4,desc:'Produces 5 wood per year.'},quarry:{name:'Quarry',icon:'⛏',wood:15,stone:0,years:4,desc:'Produces 4 stone per year.'},temple:{name:'Temple',icon:'⛪',wood:25,stone:24,years:7,path:'faith',desc:'Produces faith.'},barracks:{name:'Barracks',icon:'⚔',wood:30,stone:20,years:7,path:'war',desc:'Trains military power.'},academy:{name:'Academy',icon:'🔬',wood:28,stone:25,years:7,path:'science',desc:'Produces research.'},theatre:{name:'Theatre',icon:'🎭',wood:30,stone:22,years:7,path:'arts',desc:'Produces culture.'}};
const paths={faith:'⛪ Faith',war:'⚔ War',science:'🔬 Science',arts:'🎭 Arts'};
function rand(x,y){let n=Math.sin(x*127.1+y*311.7+SEED*3.1)*43758.5453;return n-Math.floor(n);}
function terrain(x,y){let n=rand(Math.floor(x/2),Math.floor(y/2))*.55+rand(x,y)*.45;let water=Math.sin(x*.37)+Math.cos(y*.29+x*.13);if(water>1.67)return 'water';if(n>.78)return 'forest';if(n<.17)return 'hill';return 'grass';}
const discoveries={forestry:{name:'Forestry',cost:0,desc:'Identify woodland timber and manage logging.'},geology:{name:'Geology',cost:12,desc:'Reveal stone deposits in the hills.'},agriculture:{name:'Agriculture',cost:15,desc:'Reveal fertile ground for farming.'},husbandry:{name:'Animal husbandry',cost:25,requires:'agriculture',desc:'Reveal wild herds and domesticate livestock.'},metallurgy:{name:'Metallurgy',cost:40,requires:'geology',desc:'Reveal metal ore veins and allow ore mining.'}};
function unlocked(id){return s.discoveries.includes(id);}
function deposit(x,y){let t=terrain(x,y),r=rand(x+17,y+31);if(t==='forest')return {kind:'wood',amount:16+Math.floor(r*45),tech:'forestry',icon:'🌲'};if(t==='hill')return r>.55?{kind:'ore',amount:12+Math.floor(r*28),tech:'metallurgy',icon:'⛏'}:{kind:'stone',amount:16+Math.floor(r*40),tech:'geology',icon:'🪨'};if(t==='grass'&&r>.77)return {kind:'animals',amount:3+Math.floor(r*8),tech:'husbandry',icon:'🐂'};if(t==='grass'&&r>.35)return {kind:'food',amount:14+Math.floor(r*40),tech:'agriculture',icon:'🌾'};return null;}
function available(x,y){let d=deposit(x,y);return d?Math.max(0,d.amount-(s.depleted[key(x,y)]||0)):0;}
function harvest(x,y,kind,qty){let d=deposit(x,y);if(!d||d.kind!==kind||!unlocked(d.tech))return 0;let n=Math.min(qty,available(x,y));if(n){s.depleted[key(x,y)]=(s.depleted[key(x,y)]||0)+n;if(kind==='ore')s.ore+=n;else if(kind==='animals')s.animals+=n;else s[kind]+=n;}return n;}
function localHarvest(kind,qty){let candidates=[];for(let k of s.claimed){let [x,y]=k.split(',').map(Number);let d=deposit(x,y);if(d&&d.kind===kind&&available(x,y)>0)candidates.push({x,y});}let total=0;for(let p of candidates){total+=harvest(p.x,p.y,kind,qty-total);if(total>=qty)break;}return total;}
function unlockTech(id){let d=discoveries[id];if(!d||unlocked(id)||s.science<d.cost||(d.requires&&!unlocked(d.requires)))return;s.science-=d.cost;s.discoveries.push(id);alertMsg(d.name+' researched! New resources revealed.');save();ui();}
function newGame(){return {name:'',founded:false,year:1,settler:{x:15,y:15,tx:15,ty:15},buildings:[],wood:0,stone:0,food:8,pop:1,path:null,science:0,culture:0,faith:0,war:0,tech:[],claimed:[],events:[],turns:0};}
let s;try{s=JSON.parse(localStorage.getItem('civ-fullscreen-v2'))||newGame();if(!s.settler||!s.buildings)s=newGame();}catch(e){s=newGame();}
s.moved ??= false;s.metal ??= 0;s.animals ??= 0;s.jobs ??= {farm:0,lumber:0,quarry:0,herd:0,mine:0,build:0};s.depleted ||= {};s.ore ??= 0;s.discoveries ||= [];s.wildlife ||= {};function save(){localStorage.setItem('civ-fullscreen-v2',JSON.stringify(s));}
function key(x,y){return x+','+y;}function within(x,y){return x>=0&&y>=0&&x<SIZE&&y<SIZE;}function dist(x,y,a,b){return Math.abs(x-a)+Math.abs(y-b);}
function owned(x,y){return s.claimed.includes(key(x,y));}
function building(x,y){return s.buildings.find(b=>b.x===x&&b.y===y);}
function proj(x,y){return {x:(x-y)*TW/2,y:(x+y)*TH/2};}
function screen(x,y){let p=proj(x,y);return {x:(p.x-cam.x)*zoom+cw/2,y:(p.y-cam.y)*zoom+ch/2};}
function world(sx,sy){let x=(sx-cw/2)/zoom+cam.x,y=(sy-ch/2)/zoom+cam.y;return {x:Math.round(x/TW+y/TH),y:Math.round(y/TH-x/TW)};}
function center(x,y){let p=proj(x,y);cam.x=p.x;cam.y=p.y;}
function resize(){dpr=Math.min(devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;canvas.width=Math.round(cw*dpr);canvas.height=Math.round(ch*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function poly(points,fill,stroke){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
function tile(x,y,fill,stroke){let p=screen(x,y),w=TW*zoom/2,h=TH*zoom/2;poly([[p.x,p.y-h],[p.x+w,p.y],[p.x,p.y+h],[p.x-w,p.y]],fill,stroke);}
function tree(p,x,y){let z=zoom;ctx.fillStyle='#6c4c30';ctx.fillRect(p.x-3*z,p.y-19*z,6*z,20*z);for(let j=0;j<3;j++){ctx.fillStyle=['#1d5138','#276746','#367c4e'][j];ctx.beginPath();ctx.ellipse(p.x+(j-1)*5*z,p.y-(19+j*9)*z,13*z,14*z,0,0,7);ctx.fill();}}
function structure(p,b){let z=zoom,ht=(b.type==='hall'?40:27)*z,w=(b.type==='hall'?29:21)*z,h=13*z;let roof={hall:'#9e6650',house:'#b16d4b',farm:'#b78b45',lumber:'#706b42',quarry:'#8d8980',temple:'#e0cf9d',barracks:'#8f5651',academy:'#7d9ca2',theatre:'#be8c65'}[b.type];poly([[p.x-w,p.y],[p.x,p.y+h],[p.x,p.y+h-ht],[p.x-w,p.y-ht]],'#c7b08a','#0003');poly([[p.x,p.y+h],[p.x+w,p.y],[p.x+w,p.y-ht],[p.x,p.y+h-ht]],'#9c8065','#0003');poly([[p.x-w,p.y-ht],[p.x,p.y-h-ht],[p.x+w,p.y-ht],[p.x,p.y+h-ht]],roof,'#42382b');ctx.fillStyle='#3c3329';ctx.fillRect(p.x-4*z,p.y-12*z,8*z,12*z);if(b.type==='hall'){ctx.fillStyle='#f0d78c';ctx.fillRect(p.x-2*z,p.y-ht-19*z,3*z,19*z);ctx.fillStyle='#c65e43';ctx.fillRect(p.x+1*z,p.y-ht-18*z,15*z,9*z);}if(b.remaining){ctx.font=(13*z)+'px sans-serif';ctx.fillStyle='#fff3bc';ctx.fillText('⌛',p.x+15*z,p.y-ht-9*z);}}
function paint(){ctx.fillStyle='#244e54';ctx.fillRect(0,0,cw,ch);let items=[];for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){let p=screen(x,y);if(p.x< -100||p.x>cw+100||p.y< -140||p.y>ch+130)continue;let t=terrain(x,y),r=rand(x,y),shade=Math.floor(r*4);let color=t==='water'?['#326e80','#397b8c','#438597','#387688'][shade]:t==='hill'?['#7c856f','#92947a','#808b76','#9c9980'][shade]:t==='forest'?['#497e4d','#548956','#477a4b','#608d57'][shade]:['#6e995e','#78a467','#83a96c','#729d61'][shade];tile(x,y,color,selected&&selected.x===x&&selected.y===y?'#f7d68e':null);if(t==='grass'&&r>.62){ctx.fillStyle='#a4b777';ctx.fillRect(p.x,p.y,2*zoom,3*zoom);}if(t==='water'){ctx.strokeStyle='#a6d4cc55';ctx.beginPath();ctx.moveTo(p.x-9*zoom,p.y);ctx.lineTo(p.x+5*zoom,p.y);ctx.stroke();}if(t==='forest'||t==='hill')items.push({x,y,t,p});let d=deposit(x,y);if(d&&unlocked(d.tech)&&available(x,y)>0){ctx.font=Math.max(10,15*zoom)+'px sans-serif';ctx.fillText(d.icon,p.x-6*zoom,p.y+5*zoom);}}
for(let item of items){let {x,y,t,p}=item;if(t==='forest'){tree({x:p.x-8*zoom,y:p.y+4*zoom});if(rand(x+7,y)>.4)tree({x:p.x+12*zoom,y:p.y+6*zoom});}else{poly([[p.x-22*zoom,p.y+6*zoom],[p.x-3*zoom,p.y-23*zoom],[p.x+17*zoom,p.y+7*zoom]],'#8e9482','#556b5b');poly([[p.x-4*zoom,p.y+7*zoom],[p.x+12*zoom,p.y-12*zoom],[p.x+24*zoom,p.y+7*zoom]],'#a6a596');}}
for(let b of s.buildings)structure(screen(b.x,b.y),b);
if(s.founded){let hall=s.buildings[0];if(hall){let p=screen(hall.x,hall.y);ctx.fillStyle='#f2d8a3';ctx.font='bold '+Math.max(11,14*zoom)+'px Georgia';ctx.textAlign='center';ctx.fillText(s.name,p.x,p.y-65*zoom);ctx.textAlign='left';}}
let q=screen(s.settler.x,s.settler.y);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(q.x,q.y+6*zoom,10*zoom,4*zoom,0,0,7);ctx.fill();ctx.fillStyle='#e9c39c';ctx.beginPath();ctx.arc(q.x,q.y-18*zoom,6*zoom,0,7);ctx.fill();ctx.fillStyle='#d2b078';ctx.fillRect(q.x-6*zoom,q.y-12*zoom,12*zoom,16*zoom);ctx.fillStyle='#4e4c37';ctx.fillRect(q.x-5*zoom,q.y+3*zoom,4*zoom,7*zoom);ctx.fillRect(q.x+2*zoom,q.y+3*zoom,4*zoom,7*zoom);ctx.fillStyle='#f6e3b2';ctx.font='bold '+(12*zoom)+'px sans-serif';ctx.textAlign='center';ctx.fillText('Settler',q.x,q.y-34*zoom);ctx.textAlign='left';
if(selected){let p=screen(selected.x,selected.y);ctx.strokeStyle='#ffe1a1';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(p.x,p.y,16*zoom,7*zoom,0,0,7);ctx.stroke();}
}
function alertMsg(msg){$('notice').textContent=msg;noticeUntil=Date.now()+2600;$('notice').classList.add('show');}
function walk(dt){let u=s.settler;if(u.x===u.tx&&u.y===u.ty)return;let dx=u.tx-u.x,dy=u.ty-u.y,d=Math.hypot(dx,dy);let step=Math.min(d,dt*.0035);let nx=u.x+dx/d*step,ny=u.y+dy/d*step;if(terrain(Math.round(nx),Math.round(ny))==='water'){u.tx=Math.round(u.x);u.ty=Math.round(u.y);alertMsg('Your settler cannot cross deep water.');return;}u.x=nx;u.y=ny;}
function assigned(){return Object.values(s.jobs||{}).reduce((a,b)=>a+b,0);}function jobCap(k){return k==='build'?(s.founded?99:0):k==='farm'?counts('farm')*3:k==='lumber'?counts('lumber')*3:k==='quarry'?counts('quarry')*3:k==='herd'?counts('farm'):counts('quarry');}function setJob(k,d){let n=s.jobs[k]||0;if(d>0&&(assigned()>=s.pop||n>=jobCap(k))){alertMsg('Not enough free citizens or workplaces.');return;}s.jobs[k]=Math.max(0,n+d);save();ui();}function gather(){if(s.moved){alertMsg('Unit already acted this year.');return;}let x=Math.round(s.settler.x),y=Math.round(s.settler.y),d=deposit(x,y);if(!d){alertMsg('No harvestable resources here.');return;}if(!unlocked(d.tech)){alertMsg('Research '+discoveries[d.tech].name+' to identify and harvest this resource.');return;}let n=harvest(x,y,d.kind,d.kind==='animals'?1:4);if(!n){alertMsg('This deposit is exhausted.');return;}s.moved=true;alertMsg('Gathered '+n+' '+d.kind+'.');save();ui();}
function counts(type){return s.buildings.filter(b=>b.type===type&&!b.remaining).length;}
function year(){s.moved=false;if(!s.founded){s.year++;save();ui();return;}s.year++;s.food-=Math.ceil(s.pop*.7);let j=s.jobs||{};s.food+=localHarvest('food',(j.farm||0)*3);localHarvest('wood',(j.lumber||0)*3);localHarvest('stone',(j.quarry||0)*2);localHarvest('animals',(j.herd||0));localHarvest('ore',(j.mine||0)*2);if(unlocked('metallurgy')&&(j.mine||0)>0&&s.ore>=4&&s.wood>=2){s.ore-=4;s.wood-=2;s.metal++;}s.science+=counts('academy')*3+(s.path==='science'?2:0);s.culture+=counts('theatre')*3;s.faith+=counts('temple')*3;s.war+=counts('barracks')*3;for(let b of s.buildings)if(b.remaining>0){let labor=Math.floor((s.jobs?.build||0)/2),materials=s.wood>=10&&s.stone>=5?1:0,special=s.path==='science'?1:0;b.remaining=Math.max(0,b.remaining-1-labor-materials-special);}let cap=1+counts('house')*4;if(s.food>0&&s.pop<cap&&s.year%3===0)s.pop++;if(s.food<0){s.food=0;s.pop=Math.max(1,s.pop-1);}if(s.year%8===0)alertMsg('Year '+s.year+' — Your civilisation continues to grow.');save();ui();}
function found(){let x=Math.round(s.settler.x),y=Math.round(s.settler.y);if(terrain(x,y)==='water'||building(x,y)){alertMsg('Find clear land to settle.');return;}s.founded=true;s.name='New Haven';s.buildings.push({x,y,type:'hall',remaining:0});s.claimed=[];for(let yy=y-2;yy<=y+2;yy++)for(let xx=x-2;xx<=x+2;xx++)if(within(xx,yy))s.claimed.push(key(xx,yy));s.pop=2;s.moved=false;s.science+=12;s.jobs={farm:0,lumber:0,quarry:0,herd:0,mine:0,build:0};s.settler.tx=x;s.settler.ty=y;selected={x,y};alertMsg('Your civilisation has been founded!');save();ui();}
function canBuild(id){let d=defs[id];return s.wood>=d.wood&&s.stone>=d.stone&&(!d.path||s.path);}
function build(id){if(!selected||!s.founded)return;if(s.buildings.some(b=>b.remaining>0)){alertMsg('Only one construction project at a time.');return;}let {x,y}=selected,d=defs[id];if(!owned(x,y)||terrain(x,y)==='water'||building(x,y)||!canBuild(id)){alertMsg('Cannot build here. Choose empty land in your territory.');return;}s.wood-=d.wood;s.stone-=d.stone;let bonus=(s.path==='science'?1:0)+(s.path===d.path?2:0);s.buildings.push({x,y,type:id,remaining:Math.max(1,d.years-bonus)});alertMsg('Building '+d.name+' started.');save();ui();}
function claim(){if(!selected)return;let {x,y}=selected;if(owned(x,y)||s.wood<20||s.stone<10||!s.claimed.some(k=>{let [a,b]=k.split(',').map(Number);return dist(x,y,a,b)===1;})){alertMsg('Requires adjacent land, 20 wood and 10 stone.');return;}s.wood-=20;s.stone-=10;s.claimed.push(key(x,y));save();ui();}
function choosePath(id){if(s.year<100){alertMsg('Society choices unlock in Year 100.');return;}s.path=id;menu='';alertMsg('Your people embrace '+paths[id]+'.');save();ui();}
function research(){menu='technology';ui();}
function option(title,desc,button,action,disabled=false){return '<div class="option"><strong>'+title+'</strong><p>'+desc+'</p><button class="secondary" data-action="'+action+'" '+(disabled?'disabled':'')+'>'+button+'</button></div>';}
function ui(){let r=$('resources');r.innerHTML=s.founded?'<span class="chip">🐄 <b>'+s.animals+'</b></span><span class="chip">⚙ <b>'+s.metal+'</b></span><span class="chip">🌾 <b>'+s.food+'</b></span><span class="chip">🪵 <b>'+s.wood+'</b></span><span class="chip">🪨 <b>'+s.stone+'</b></span><span class="chip">👥 <b>'+s.pop+'</b></span><span class="chip">Year <b>'+s.year+'</b></span>':'<span class="chip">🌍 Explore the world</span>';
let info=$('info'),act=$('actions');if(!s.founded){info.innerHTML='<h2>One settler. A new world.</h2><p>Tap the landscape to walk. Drag to explore and pinch to zoom. Find the perfect spot for your first city.</p><span class="badge">Explore → Gather → Found your city</span>';act.innerHTML='<button class="primary" data-action="found">🏛 Found City</button><button class="secondary" data-action="gather">🧺 Gather</button><button class="secondary" data-action="endYear">End Year →</button>';}else{let t=selected?terrain(selected.x,selected.y):'grass',b=selected?building(selected.x,selected.y):null;let dep=selected?deposit(selected.x,selected.y):null;let resourceText=dep&&unlocked(dep.tech)?' · '+dep.kind+' '+available(selected.x,selected.y)+' remaining':'';info.innerHTML='<h2>'+s.name+' · Year '+s.year+'</h2><p>'+(b?(b.type==='hall'?'Town centre':defs[b.type].name)+(b.remaining?' · '+b.remaining+' years remaining':' · Ready'):selected?(owned(selected.x,selected.y)?'Your territory · '+t+resourceText:'Wilderness · '+t+resourceText):'Tap land to inspect or build.')+'</p><span class="badge">'+(s.path?paths[s.path]:'An emerging civilisation')+'</span>';act.innerHTML='<button class="primary" data-action="buildMenu">⚒ Build</button><button class="secondary" data-action="workers">👥 Workers</button><button class="secondary" data-action="technology">🔬 Tech</button><button class="secondary" data-action="gather">🧺 Gather</button><button class="secondary" data-action="move">🚶 Move</button><button class="primary" data-action="endYear">End Year →</button><button class="secondary" data-action="society">♜ Society</button>';}
let dr=$('drawer');dr.classList.toggle('open',!!menu);let body='';
if(menu==='build'){body='<h3>Construct a building</h3><p class="hint">Select an empty tile within your territory.</p>';for(let [id,d] of Object.entries(defs)){if(d.path&&!s.path)continue;body+=option(d.icon+' '+d.name,d.desc+' · '+d.wood+' wood · '+d.stone+' stone · '+d.years+' years','Construct','build:'+id,!canBuild(id));}body+=option('🏳 Expand territory','Claim the selected adjacent tile · 20 wood · 10 stone','Claim land','claim');}
if(menu==='society'){body='<h3>Shape your society</h3><p class="hint">At Year 100, choose a direction. Specialised buildings construct faster.</p>';for(let [id,name] of Object.entries(paths))body+=option(name,id==='faith'?'Temples and belief':id==='war'?'Military strength':id==='science'?'Faster construction and research':'Culture and faster population growth',s.path===id?'Current direction':'Choose direction','path:'+id,s.year<100);body+=option('🔬 Improved tools','Research: '+Math.floor(s.science)+' / 25 points','Research technology','research',s.science<25);}
if(menu==='technology'){body='<h3>Discover resources</h3><p class="hint">Research reveals hidden deposits. Unresearched resources cannot be harvested. Research points: '+Math.floor(s.science)+'</p>';for(let [id,d] of Object.entries(discoveries))body+=option(d.name,d.desc+(d.requires?' Requires '+discoveries[d.requires].name+'.':''),unlocked(id)?'Discovered':'Research · '+d.cost+' points','unlock:'+id,unlocked(id)||s.science<d.cost||(d.requires&&!unlocked(d.requires)));}if(menu==='workers'){body='<h3>Assign workers</h3><p class="hint">Free citizens: '+(s.pop-assigned())+' / '+s.pop+'. Assign people to staffed workplaces.</p>';for(let k of ['farm','lumber','quarry','herd','mine','build'])body+='<div class="option"><strong>'+({farm:'🌾 Farming',lumber:'🪵 Logging',quarry:'🪨 Quarrying',herd:'🐄 Herding',mine:'⚙ Mining ore',build:'🏗 Construction'}[k])+'</strong><p>Assigned: '+(s.jobs[k]||0)+' / '+jobCap(k)+'</p><button class="secondary" data-job="'+k+':-1">− Remove</button><button class="secondary" data-job="'+k+':1">＋ Assign</button></div>';}if(menu==='move'){body='<h3>Move settler</h3><p class="hint">Tap an adjacent tile on the map. One move or gather action per year.</p>';}if(menu==='main'){ body='<h3>Game menu</h3>'+option('Save progress','Saved automatically in this browser.','Save now','save')+option('New world','Restart with a lone settler. This replaces your save.','Start again','reset')+'<p class="hint">Civ · early playable prototype</p>';}
dr.innerHTML=body;dr.querySelectorAll('[data-job]').forEach(el=>el.onclick=()=>{let [k,d]=el.dataset.job.split(':');setJob(k,Number(d));});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{let a=el.dataset.action;if(a==='found')found();else if(a==='endYear')year();else if(a==='gather')gather();else if(a==='move'){menu='move';alertMsg('Tap an adjacent tile to move the settler.');}else if(a==='workers'){menu=menu==='workers'?'':'workers';ui();}else if(a==='buildMenu'){menu=menu==='build'?'':'build';ui();}else if(a==='society'){menu=menu==='society'?'':'society';ui();}else if(a==='claim')claim();else if(a==='research')research();else if(a==='technology'){menu=menu==='technology'?'':'technology';ui();}else if(a.startsWith('unlock:'))unlockTech(a.slice(7));else if(a==='save'){save();alertMsg('Progress saved.');}else if(a==='reset'){if(confirm('Start a new world and erase your current progress?')){s=newGame();selected=null;menu='';center(15,15);save();ui();}}else if(a.startsWith('build:'))build(a.slice(6));else if(a.startsWith('path:'))choosePath(a.slice(5));});}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};});canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)drag.moved=true;if(drag.moved){cam.x=drag.cx-dx/zoom;cam.y=drag.cy-dy/zoom;}});canvas.addEventListener('pointerup',e=>{if(!drag)return;let moved=drag.moved;drag=null;if(moved)return;let p=world(e.clientX,e.clientY);if(!within(p.x,p.y))return;selected=p;if(!s.founded||menu==='move'){if(terrain(p.x,p.y)==='water'){alertMsg('Water blocks the path.');return;}if(s.moved){alertMsg('This unit has already moved this year.');return;}if(dist(Math.round(s.settler.x),Math.round(s.settler.y),p.x,p.y)>1){alertMsg('Units can move one tile per year.');return;}s.settler.x=p.x;s.settler.y=p.y;s.settler.tx=p.x;s.settler.ty=p.y;s.moved=true;menu='';save();}ui();});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2.2,zoom+(e.deltaY<0?.12:-.12)));},{passive:false});
$('zoomIn').onclick=()=>zoom=Math.min(2.2,zoom+.2);$('zoomOut').onclick=()=>zoom=Math.max(.55,zoom-.2);$('menuBtn').onclick=()=>{menu=menu==='main'?'':'main';ui();};
let touchDist=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(touchDist)zoom=Math.max(.55,Math.min(2.2,zoom*d/touchDist));touchDist=d;drag=null;}},{passive:true});canvas.addEventListener('touchend',()=>touchDist=0);
function loop(now){let dt=Math.min(now-last||16,60);last=now;walk(dt);if(noticeUntil&&Date.now()>noticeUntil){$('notice').classList.remove('show');noticeUntil=0;}paint();requestAnimationFrame(loop);}
addEventListener('resize',resize);resize();center(s.settler.x,s.settler.y);ui();requestAnimationFrame(loop);
})();
</script></body></html>
